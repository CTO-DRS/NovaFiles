# Memory-tuned for constrained build environment (4 GB RAM / 2 cores)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# v0.41 — صمود الشبكة في البيئات المقيّدة: إعادة محاولة تلقائية عبر مرآة احتياطية
systemProp.org.gradle.internal.http.max.tentatives=10
systemProp.org.gradle.internal.http.connection.timeout=30000
systemProp.org.gradle.internal.http.socket.timeout=30000
