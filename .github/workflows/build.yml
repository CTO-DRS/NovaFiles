name: Build APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK + unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Upload artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: NovaFiles-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release APK (only when signing secrets are set)
        id: signed
        continue-on-error: true
        env:
          KS_B64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Signing secrets not set: skipping signed release build."; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          export NOVA_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease --no-daemon --stacktrace
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKSIGNER" ]; then for f in app/build/outputs/apk/release/*.apk; do "$APKSIGNER" verify --print-certs "$f" | grep -i 'SHA-256'; done; fi
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaFiles-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Attach APK to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk "NovaFiles_${GITHUB_REF_NAME}.apk"
            ASSET="NovaFiles_${GITHUB_REF_NAME}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "NovaFiles_${GITHUB_REF_NAME}_iOS_debug.apk"
            ASSET="NovaFiles_${GITHUB_REF_NAME}_iOS_debug.apk"
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists — replacing APK asset (--clobber)"
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating new release with APK"
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NovaFiles $GITHUB_REF_NAME" \
              --generate-notes
          fi
          echo "=== Asset verification ==="
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name + "  " + (.size|tostring) + " bytes"'
