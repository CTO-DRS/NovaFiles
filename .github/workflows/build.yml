name: Build APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK + unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Upload artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: NovaFiles-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "NovaFiles_${GITHUB_REF_NAME}_iOS_debug.apk"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists — replacing APK asset (--clobber)"
            gh release upload "$GITHUB_REF_NAME" "NovaFiles_${GITHUB_REF_NAME}_iOS_debug.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating new release with APK"
            gh release create "$GITHUB_REF_NAME" "NovaFiles_${GITHUB_REF_NAME}_iOS_debug.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NovaFiles $GITHUB_REF_NAME" \
              --generate-notes
          fi
          echo "=== Asset verification ==="
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name + "  " + (.size|tostring) + " bytes"'
